<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0e18;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}body{touch-action:none}button,input{font:inherit}#app{width:100%;height:100%;display:flex;align-items:center;justify-content:center}.screen{width:min(1100px,100%);height:min(760px,100%);position:relative;display:none}.screen.active{display:flex}
#lobby{flex-direction:column;overflow:auto;padding:18px 14px 26px;background:radial-gradient(circle at 50% 0,#1e2c55 0,#0a0e18 58%)}.logo{font-weight:1000;font-size:clamp(30px,6vw,62px);letter-spacing:-3px;text-align:center;margin:4px 0 6px}.subtitle{opacity:.72;text-align:center;margin-bottom:18px}.panel{width:min(960px,100%);margin:0 auto 14px;background:rgba(21,28,47,.92);border:1px solid #33405f;border-radius:18px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.26)}.panel h2{margin:0 0 10px;font-size:18px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.modeRow{display:flex;gap:8px;flex-wrap:wrap}.modeBtn{border:1px solid #435170;background:#17223a;color:#fff;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}.modeBtn.active{border-color:#a78bfa;background:#4c3b8f;box-shadow:0 0 0 2px rgba(167,139,250,.15)}input{background:#0d1323;border:1px solid #3a486b;color:#fff;border-radius:12px;padding:12px 14px;min-width:160px;outline:none}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:900;background:#273653;color:#fff;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);user-select:none}.btn:active{transform:translateY(1px);filter:brightness(.9)}.btn.primary{background:#7c5cff}.btn.good{background:#16a34a}.btn.warn{background:#ea580c}.btn:disabled{opacity:.4;cursor:not-allowed}.status{font-size:13px;opacity:.8;min-height:18px;margin-top:8px;white-space:pre-wrap}.selects{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.playerCard{background:#101728;border:1px solid #303d5b;border-radius:16px;padding:12px}.playerTitle{font-weight:1000;margin-bottom:8px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.char{position:relative;background:#18223a;border:2px solid transparent;border-radius:14px;padding:8px;cursor:pointer;min-width:0;color:#fff}.char.selected{border-color:#a78bfa;box-shadow:0 0 0 2px rgba(167,139,250,.17)}.char.locked{opacity:.42;cursor:not-allowed}.char img{width:100%;height:110px;object-fit:contain;background:#0c1220;border-radius:10px;display:block}.char .name{font-weight:1000;margin-top:6px;font-size:14px}.char .stats{font-size:11px;opacity:.72;line-height:1.35;margin-top:2px}.readyDot{position:absolute;top:7px;right:7px;background:#16a34a;border-radius:99px;padding:2px 6px;font-size:10px;font-weight:900;display:none}.char.selected .readyDot{display:block}.slotList{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.slotMini{background:#0d1527;border:1px solid #303d5b;border-radius:10px;padding:8px;font-size:11px}.slotMini strong{display:block;font-size:12px}.controlsHelp{font-size:12px;opacity:.7;line-height:1.5}
#game{background:#0b0f19;align-items:center;justify-content:center;overflow:hidden}#arenaWrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(#10182a,#08101d)}canvas{display:block;width:100%;height:100%;outline:none;background:linear-gradient(#182f48,#0e1e2e);touch-action:none}.hud{position:absolute;top:10px;left:10px;right:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;pointer-events:none}.hpBox{background:rgba(5,8,14,.72);border:1px solid #4c5b79;border-radius:12px;padding:6px 8px}.hpTop{display:flex;justify-content:space-between;font-size:11px;font-weight:1000;margin-bottom:4px;gap:4px}.hpbar{height:10px;background:#20283a;border-radius:999px;overflow:hidden}.hpfill{height:100%;width:100%;background:#32d06d;transition:width .14s linear}.hpBox.teamB .hpfill{background:#ff5c79}.cooldowns{display:flex;gap:4px;margin-top:4px;overflow:hidden}.cd{background:rgba(5,8,14,.72);border:1px solid #4c5b79;border-radius:7px;padding:3px 5px;font-size:9px;font-weight:900;white-space:nowrap}.deadBox{opacity:.45}.deadBox .hpfill{background:#666!important}#centerMsg{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:clamp(24px,7vw,54px);font-weight:1000;text-align:center;text-shadow:0 4px 20px #000;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap}#roomBadge{position:absolute;top:92px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.45);padding:5px 10px;border-radius:99px;font-size:11px;pointer-events:none;z-index:5}#backBtn{position:absolute;left:12px;bottom:12px;z-index:20}.touch{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.joystick{width:148px;height:148px;position:relative;border:1px solid rgba(180,200,235,.38);background:rgba(15,22,38,.48);border-radius:50%;pointer-events:auto;opacity:.92;touch-action:none;user-select:none;box-shadow:inset 0 0 24px rgba(0,0,0,.25)}.joystick:after{content:"";position:absolute;left:50%;top:50%;width:58px;height:58px;transform:translate(-50%,-50%);border:1px dashed rgba(255,255,255,.15);border-radius:50%}.stick{position:absolute;left:50%;top:50%;width:64px;height:64px;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.5);background:rgba(74,91,130,.9);border-radius:50%;z-index:2;box-shadow:0 6px 16px rgba(0,0,0,.35);touch-action:none}.joystick.active .stick{filter:brightness(1.18)}.attackBtns{display:flex;gap:10px;pointer-events:auto}.attack{width:84px;height:84px;border-radius:50%;border:2px solid rgba(255,255,255,.45);color:#fff;font-weight:1000;background:#2c3b5e;box-shadow:0 7px 20px rgba(0,0,0,.3);touch-action:none;user-select:none}.attack.basic{background:#2563eb}.attack.ult{background:#b026d9}.attack:active{transform:scale(.94)}.attack.flash{animation:attackFlash .28s ease-out}@keyframes attackFlash{0%{transform:scale(1);filter:brightness(1)}35%{transform:scale(1.16);filter:brightness(1.8)}100%{transform:scale(1);filter:brightness(1)}}@media (hover:hover) and (pointer:fine){.touch{display:none}}
@media(max-width:520px){.touch{bottom:max(10px,env(safe-area-inset-bottom));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));}.joystick{width:136px;height:136px}.stick{width:58px;height:58px}.attack{width:72px;height:72px;font-size:12px}.attackBtns{gap:7px}.mobileExtra{display:flex!important}}

.mobileExtra button{border:1px solid #6d7ea4;background:rgba(15,22,38,.88);color:#fff;border-radius:12px;padding:10px 13px;font-weight:1000;touch-action:none;user-select:none}#mobileHint{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:10px;opacity:.45;pointer-events:none}#gameOver{position:absolute;inset:0;background:rgba(3,6,12,.68);display:none;align-items:center;justify-content:center;z-index:30}#gameOver.show{display:flex}.overBox{background:#11182a;border:1px solid #586a91;border-radius:20px;padding:24px;text-align:center;min-width:260px;box-shadow:0 20px 70px rgba(0,0,0,.5)}.overBox h2{margin:0 0 6px;font-size:34px}.overBox p{margin:0 0 16px;opacity:.78}.toast{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);padding:7px 11px;border-radius:10px;font-size:12px;opacity:0;transition:opacity .15s;pointer-events:none;z-index:15}.toast.show{opacity:1}
@media(max-width:760px){.selects{grid-template-columns:1fr}.slotList{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.hud{grid-template-columns:repeat(2,minmax(0,1fr))}.hpBox{padding:5px 6px}.hpTop{font-size:9px}.cooldowns{display:none}}
</style></head><body>
<div id="app">
<section id="lobby" class="screen active">
<div class="logo">야매떼 파이터들</div><div class="subtitle" id="subtitle">빠른 이동 + 실시간 멀티 아레나</div>
<div class="panel"><h2>① 게임 모드</h2><div class="modeRow"><button id="mode1" class="modeBtn active" type="button">1 대 1</button><button id="mode3" class="modeBtn" type="button">1 대 1 대 1</button><button id="mode4" class="modeBtn" type="button">2 대 2</button></div><div class="status" id="modeStatus">2명이 싸우는 일반 대전</div></div>
<div class="panel"><h2>② 온라인 방</h2><div class="row"><button id="createBtn" class="btn primary" type="button">방 만들기</button><input id="roomCode" maxlength="6" placeholder="친구 방 코드" autocomplete="off" spellcheck="false"><button id="joinBtn" class="btn good" type="button">방 참가</button></div><div class="status" id="netStatus">온라인 준비 중…</div><div class="slotList" id="slotList"></div></div>
<div class="panel"><h2>③ 캐릭터 선택</h2><div class="selects" id="selects"></div></div>
<div class="panel"><div class="row"><button id="startBtn" class="btn primary" type="button" disabled>전투 시작</button><button id="testBtn" class="btn warn" type="button">혼자 테스트</button><button id="resetBtn" class="btn" type="button">처음부터</button></div><div class="controlsHelp">PC: WASD/방향키 이동 · 마우스 좌클릭 기본기 · F 궁극기 · 홍우민 R 변신 · 모바일: 조이스틱 + 기술 버튼</div></div>
</section>
<section id="game" class="screen"><div id="arenaWrap"><canvas id="arena" tabindex="0" aria-label="게임 화면"></canvas><div class="hud" id="hud"></div><div id="roomBadge"></div><div id="centerMsg"></div><div id="mobileHint">화면 아래 버튼으로 이동/공격</div><div class="touch"><div id="joystick" class="joystick" aria-label="이동 조이스틱"><div id="stick" class="stick"></div></div><div class="attackBtns"><button id="basicBtn" type="button" class="attack basic">기본기</button><button id="ultBtn" type="button" class="attack ult">궁극기</button></div></div><div id="mobileExtra" class="mobileExtra"><button id="transformBtn" type="button">홍우민 변신</button></div><button id="backBtn" type="button" class="btn">로비</button><div id="toast" class="toast"></div><div id="gameOver"><div class="overBox"><h2 id="winnerText">승리!</h2><p id="overSub">전투 종료</p><button id="againBtn" type="button" class="btn primary">다시 하기</button></div></div></div></section>
</div>
<script>
const IMG={"꼬미":"komi.jpg","홍우주":"hongwooju.jpg","지한서":"jihansuh.jpg","홍우민":"hongwoomin.jpg","박시후":"박시후.jpg","오승택":"오승택.jpg","채민성":"채민성.jpg","차은우":"차은우.jpg"};
const CHARS={
 꼬미:{hp:125,speed:465,basicCd:.55,ultCd:6.5,basicDmg:15,basicRange:95,ultDmg:40,ultRange:250,color:'#f3c969',desc:'빠른 근접 돌진',basic:'물기',ult:'분노 돌진'},
 홍우주:{hp:100,speed:490,basicCd:.48,ultCd:6.9,basicDmg:10,basicRange:650,ultDmg:24,ultRange:760,color:'#ff83bd',desc:'1초 유도 원거리',basic:'야매떼',ult:'자기야 사귀자 빔!!!'},
 지한서:{hp:140,speed:580,basicCd:.62,ultCd:7.8,basicDmg:12,basicRange:125,ultDmg:40,ultRange:180,color:'#68d6ff',desc:'튼튼한 과자 파이터',basic:'과자 휘두르기',ult:'광란의 과자 파티'},
 홍우민:{hp:115,speed:500,basicCd:.65,ultCd:0,basicDmg:10,basicRange:720,ultDmg:0,ultRange:0,color:'#f4f4f4',desc:'R 변신 · 12초 후 각성',basic:'비듬 / 야매떼',ult:'각성'},
 박시후:{hp:120,speed:470,basicCd:.72,ultCd:9,basicDmg:10,basicRange:125,ultDmg:20,ultRange:0,color:'#ffd1dc',desc:'전방위 입술 · 아기 5마리',basic:'입술',ult:'아기 5마리'},
 오승택:{hp:110,speed:480,basicCd:.72,ultCd:10.5,basicDmg:15,basicRange:0,ultDmg:35,ultRange:0,color:'#b58cff',desc:'0.8초 유도 회오리 · 거시기 토네이도!!!!',basic:'유도 회오리',ult:'거시기 토네이도!!!!'},
 채민성:{hp:130,speed:470,basicCd:.85,ultCd:9.5,basicDmg:15,basicRange:115,ultDmg:5,ultRange:220,color:'#ffd84d',desc:'쮸압 주파수 · 회전 컬러 라인',basic:'괴상한 쮸압 주파수',ult:'남자친구 만들기'},
 차은우:{hp:120,speed:455,basicCd:1.05,ultCd:9,basicDmg:20,basicRange:105,ultDmg:40,ultRange:0,color:'#ffb3d1',desc:'넓은 괴성 · 분신 · 1회성 대폭발',basic:'게이 소리 지르기',ult:'앙 두명이에용'}
};
const names=Object.keys(CHARS),qs=id=>document.getElementById(id),canvas=qs('arena'),ctx=canvas.getContext('2d');
const keys={up:false,down:false,left:false,right:false};
const MODES={one:{label:'1 대 1',count:2,status:'2명이 싸우는 일반 대전'},ffa:{label:'1 대 1 대 1',count:3,status:'3명이 모두 적인 개인전'},team:{label:'2 대 2',count:4,status:'두 팀으로 나뉘는 4인 팀전'}};
const state={mode:'one',host:false,online:false,peer:null,code:'',running:false,solo:false,localSlot:1,players:{1:'꼬미',2:'홍우주',3:'지한서',4:'박시후'},connections:{},connTimers:{},guestRetry:0,guestConnTimer:null,connectedSlots:{}};
let W=1000,H=620,last=performance.now(),raf=0,world=null,fx=[],projectiles=[],powderFields=[],vortexes=[],frequencyUltZones=[],netClock=0,netInputClock=0,screenShake=0;
const imgCache={};
for(const n of names){const im=new Image();im.src=IMG[n];im.onload=()=>draw();imgCache[n]=im}
function setNet(m){qs('netStatus').textContent=m}function toast(m){const t=qs('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600)}function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));qs(id).classList.add('active')}
function maxPlayers(){return MODES[state.mode].count}function teamOf(side){if(state.mode!=='team')return side;return side<=2?1:2}function alivePlayers(){return world.players.filter(p=>p&&p.hp>0)}
function randCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function renderLobby(){
 qs('subtitle').textContent=state.mode==='team'?'빠른 이동 + 2대 2 팀 아레나':'빠른 이동 + 실시간 '+MODES[state.mode].label+' 아레나';
 qs('modeStatus').textContent=MODES[state.mode].status;
 for(const id of ['mode1','mode3','mode4'])qs(id).classList.remove('active');qs(state.mode==='one'?'mode1':state.mode==='ffa'?'mode3':'mode4').classList.add('active');
 const count=maxPlayers(),sl=qs('slotList');sl.innerHTML='';
 for(let i=1;i<=count;i++){const connected=state.solo?(i===1):(state.host?(i===1||!!(state.connections[i]&&state.connections[i].open)):(i===state.localSlot||!!state.connectedSlots[i]));const d=document.createElement('div');d.className='slotMini';d.innerHTML='<strong>P'+i+(state.mode==='team'?' · 팀 '+(teamOf(i)==1?'A':'B'):'')+'</strong><span>'+state.players[i]+'</span><br><span>'+ (connected?'🟢 연결됨':'⚪ 대기중')+'</span>';sl.appendChild(d)}
 const sel=qs('selects');sel.innerHTML='';
 for(let i=1;i<=count;i++){const card=document.createElement('div');card.className='playerCard';const can=state.solo?(i<=2):i===state.localSlot;const title=state.solo?(i===1?'P1 / 나':'P2 / 테스트 상대'):'P'+i+(state.mode==='team'?' / 팀 '+(teamOf(i)==1?'A':'B'):'')+(can?' / 나':'');const help=state.solo?(i===1?'내 캐릭터를 선택하세요.':'상대 캐릭터를 선택하세요. 이 캐릭터는 테스트용 AI로 움직여요.'):(can?'내 캐릭터를 선택하세요.':(state.connections[i]?'플레이어가 선택 중이에요.':'아직 참가하지 않았어요.'));card.innerHTML='<div class="playerTitle">'+title+'</div><div class="cards"></div><div class="status">'+help+'</div>';const list=card.querySelector('.cards');names.forEach(n=>{const c=CHARS[n],b=document.createElement('button');b.type='button';b.className='char'+(state.players[i]===n?' selected':'')+(!can?' locked':'');b.innerHTML='<span class="readyDot">선택</span><img src="'+IMG[n]+'" alt=""><div class="name">'+n+'</div><div class="stats">HP '+c.hp+' · 이동 '+c.speed+'<br>'+c.desc+'<br>기본: '+c.basic+'<br>궁극: '+c.ult+'</div>';if(can)b.addEventListener('click',()=>selectChar(i,n));list.appendChild(b)});sel.appendChild(card)}
 updateStart();
}
function selectChar(slot,n){if(!state.solo&&slot!==state.localSlot)return;state.players[slot]=n;renderLobby();if(state.online){if(state.host)sendAll({t:'lobby',mode:state.mode,players:state.players,connected:Object.keys(state.connections).map(Number)});else sendToHost({t:'select',who:slot,char:n})}}
function peerErrorText(e,role){const t=e&&e.type||'unknown';const map={'peer-unavailable':'방을 찾지 못했어요. 방 코드를 다시 확인해주세요.','network':'인터넷/신호 서버 연결에 실패했어요.','server-error':'온라인 서버에 연결하지 못했어요.','socket-error':'온라인 연결 통신에 문제가 생겼어요.','socket-closed':'온라인 서버 연결이 끊겼어요.','webrtc':'브라우저 간 실시간 연결에 실패했어요. 다른 네트워크에서 다시 시도해주세요.','browser-incompatible':'이 브라우저에서는 온라인 기능을 사용할 수 없어요.','unavailable-id':'방 코드가 이미 사용 중이에요. 새 방 코드를 만들게요.'};return map[t]||((role==='host'?'방 만들기':'방 참가')+' 실패: '+t)}
function clearConnTimer(slot){if(state.connTimers[slot]){clearTimeout(state.connTimers[slot]);delete state.connTimers[slot]}}
function sendTo(slot,m){const c=state.connections[slot];if(c&&c.open){try{c.send(m);return true}catch(e){}}return false}
function sendAll(m){for(const s of Object.keys(state.connections))sendTo(+s,m)}
