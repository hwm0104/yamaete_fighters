<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><title>야매떼 파이터들</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0e18;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}body{touch-action:none}button,input{font:inherit}#app{width:100%;height:100%;display:flex;align-items:center;justify-content:center}.screen{width:min(1100px,100%);height:min(760px,100%);position:relative;display:none}.screen.active{display:flex}
#lobby{flex-direction:column;overflow:auto;padding:18px 14px 26px;background:radial-gradient(circle at 50% 0,#1e2c55 0,#0a0e18 58%)}.logo{font-weight:1000;font-size:clamp(30px,6vw,62px);letter-spacing:-3px;text-align:center;margin:4px 0 6px}.subtitle{opacity:.72;text-align:center;margin-bottom:18px}.panel{width:min(880px,100%);margin:0 auto 14px;background:rgba(21,28,47,.92);border:1px solid #33405f;border-radius:18px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.26)}.panel h2{margin:0 0 10px;font-size:18px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input{background:#0d1323;border:1px solid #3a486b;color:#fff;border-radius:12px;padding:12px 14px;min-width:160px;outline:none}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:900;background:#273653;color:#fff;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);user-select:none}.btn:active{transform:translateY(1px);filter:brightness(.9)}.btn.primary{background:#7c5cff}.btn.good{background:#16a34a}.btn.warn{background:#ea580c}.btn:disabled{opacity:.4;cursor:not-allowed}.status{font-size:13px;opacity:.8;min-height:18px;margin-top:8px;white-space:pre-wrap}.selects{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.selects{grid-template-columns:1fr}}.playerCard{background:#101728;border:1px solid #303d5b;border-radius:16px;padding:12px}.playerTitle{font-weight:1000;margin-bottom:8px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.char{position:relative;background:#18223a;border:2px solid transparent;border-radius:14px;padding:8px;cursor:pointer;min-width:0;color:#fff}.char.selected{border-color:#a78bfa;box-shadow:0 0 0 2px rgba(167,139,250,.17)}.char img{width:100%;height:120px;object-fit:contain;background:#0c1220;border-radius:10px;display:block}.char .name{font-weight:1000;margin-top:6px;font-size:14px}.char .stats{font-size:11px;opacity:.72;line-height:1.35;margin-top:2px}.readyDot{position:absolute;top:7px;right:7px;background:#16a34a;border-radius:99px;padding:2px 6px;font-size:10px;font-weight:900;display:none}.char.selected .readyDot{display:block}.controlsHelp{font-size:12px;opacity:.7;line-height:1.5}
#game{background:#0b0f19;align-items:center;justify-content:center;overflow:hidden}#arenaWrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(#10182a,#08101d)}canvas{display:block;width:100%;height:100%;background:linear-gradient(#182f48,#0e1e2e);touch-action:none}.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:10px;justify-content:space-between;pointer-events:none}.half{width:44%;min-width:0}.hpBox{background:rgba(5,8,14,.72);border:1px solid #4c5b79;border-radius:12px;padding:7px 9px}.hpTop{display:flex;justify-content:space-between;font-size:12px;font-weight:1000;margin-bottom:5px}.hpbar{height:14px;background:#20283a;border-radius:999px;overflow:hidden}.hpfill{height:100%;width:100%;background:#32d06d;transition:width .14s linear}.p2 .hpfill{background:#ff5c79}.cooldowns{display:flex;gap:6px;margin-top:6px}.cd{background:rgba(5,8,14,.72);border:1px solid #4c5b79;border-radius:9px;padding:4px 7px;font-size:10px;font-weight:900}#centerMsg{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:clamp(24px,7vw,54px);font-weight:1000;text-align:center;text-shadow:0 4px 20px #000;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap}#roomBadge{position:absolute;top:92px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.45);padding:5px 10px;border-radius:99px;font-size:11px;pointer-events:none}#backBtn{position:absolute;left:12px;bottom:12px;z-index:20}.touch{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.dpad{width:148px;height:148px;position:relative;pointer-events:auto;opacity:.9}.dpad button{position:absolute;width:48px;height:48px;border:1px solid #6d7ea4;background:rgba(15,22,38,.82);color:#fff;border-radius:12px;font-weight:1000;font-size:19px;touch-action:none;user-select:none}.dpad .up{left:50px;top:0}.dpad .down{left:50px;bottom:0}.dpad .left{left:0;top:50px}.dpad .right{right:0;top:50px}.attackBtns{display:flex;gap:10px;pointer-events:auto}.attack{width:84px;height:84px;border-radius:50%;border:2px solid rgba(255,255,255,.45);color:#fff;font-weight:1000;background:#2c3b5e;box-shadow:0 7px 20px rgba(0,0,0,.3);touch-action:none;user-select:none}.attack.basic{background:#2563eb}.attack.ult{background:#b026d9}.attack:active{transform:scale(.94)}.attack.flash{animation:attackFlash .28s ease-out}@keyframes attackFlash{0%{transform:scale(1);filter:brightness(1)}35%{transform:scale(1.16);filter:brightness(1.8)}100%{transform:scale(1);filter:brightness(1)}}@media(min-width:900px){.touch{display:none}}#mobileHint{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:10px;opacity:.45;pointer-events:none}#gameOver{position:absolute;inset:0;background:rgba(3,6,12,.68);display:none;align-items:center;justify-content:center;z-index:30}#gameOver.show{display:flex}.overBox{background:#11182a;border:1px solid #586a91;border-radius:20px;padding:24px;text-align:center;min-width:260px;box-shadow:0 20px 70px rgba(0,0,0,.5)}.overBox h2{margin:0 0 6px;font-size:34px}.overBox p{margin:0 0 16px;opacity:.78}.toast{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);padding:7px 11px;border-radius:10px;font-size:12px;opacity:0;transition:opacity .15s;pointer-events:none;z-index:15}.toast.show{opacity:1}
</style></head><body>
<div id="app">
<section id="lobby" class="screen active">
<div class="logo">야매떼 파이터들</div><div class="subtitle">빠른 이동 + 실시간 1 vs 1 온라인 아레나</div>
<div class="panel"><h2>① 온라인 방</h2><div class="row"><button id="createBtn" class="btn primary" type="button">방 만들기</button><input id="roomCode" maxlength="6" placeholder="친구 방 코드" autocomplete="off" spellcheck="false"><button id="joinBtn" class="btn good" type="button">방 참가</button></div><div class="status" id="netStatus">온라인 준비 중…</div></div>
<div class="panel"><h2>② 캐릭터 선택</h2><div class="selects"><div class="playerCard"><div class="playerTitle">P1 / 나</div><div class="cards" id="p1cards"></div><div class="status" id="p1Status">캐릭터를 선택하세요.</div></div><div class="playerCard"><div class="playerTitle">P2 / 친구</div><div class="cards" id="p2cards"></div><div class="status" id="p2Status">친구가 선택할 수 있어요.</div></div></div></div>
<div class="panel"><div class="row"><button id="startBtn" class="btn primary" type="button" disabled>전투 시작</button><button id="testBtn" class="btn warn" type="button">혼자 테스트</button><button id="resetBtn" class="btn" type="button">처음부터</button></div><div class="controlsHelp">PC: WASD/방향키 이동 · 마우스 좌클릭 기본기 · F 궁극기 · 모바일: 방향 버튼 + 기술 버튼</div></div>
</section>
<section id="game" class="screen"><div id="arenaWrap"><canvas id="arena"></canvas><div class="hud"><div class="half"><div class="hpBox"><div class="hpTop"><span id="p1name">P1</span><span id="p1hptext">0/0</span></div><div class="hpbar"><div id="p1fill" class="hpfill"></div></div><div id="p1cd" class="cooldowns"></div></div></div><div class="half"><div class="hpBox"><div class="hpTop"><span id="p2name">P2</span><span id="p2hptext">0/0</span></div><div class="hpbar"><div id="p2fill" class="hpfill"></div></div><div id="p2cd" class="cooldowns"></div></div></div></div><div id="roomBadge"></div><div id="centerMsg"></div><div id="mobileHint">화면 아래 버튼으로 이동/공격</div><div class="touch"><div class="dpad"><button type="button" class="up" data-key="up">▲</button><button type="button" class="left" data-key="left">◀</button><button type="button" class="right" data-key="right">▶</button><button type="button" class="down" data-key="down">▼</button></div><div class="attackBtns"><button id="basicBtn" type="button" class="attack basic">기본기</button><button id="ultBtn" type="button" class="attack ult">궁극기</button></div></div><button id="backBtn" type="button" class="btn">로비</button><div id="toast" class="toast"></div><div id="gameOver"><div class="overBox"><h2 id="winnerText">승리!</h2><p id="overSub">전투 종료</p><button id="againBtn" type="button" class="btn primary">다시 하기</button></div></div></div></section>
</div>
<script type="module">
const characterFiles=['./characters/hongwooju.character','./characters/jihansuh.character','./characters/komi.character'];
const loadedCharacters=await Promise.all(characterFiles.map(async f=>{const r=await fetch(f);if(!r.ok)throw new Error('캐릭터 파일을 불러올 수 없습니다: '+f);return await r.json()}));
const CHARS=Object.fromEntries(loadedCharacters.map(c=>[c.name,c]));
const names=loadedCharacters.map(c=>c.name);
const state={p1:'꼬미',p2:'홍우주',host:false,online:false,peer:null,conn:null,code:'',running:false,solo:false,remoteReady:false};
const keys={up:false,down:false,left:false,right:false};
const canvas=document.getElementById('arena'),ctx=canvas.getContext('2d');
if(!ctx) throw new Error('Canvas 2D를 사용할 수 없습니다.');
let W=1000,H=620,last=performance.now(),raf=0,world=null,fx=[],projectiles=[],netClock=0;
const qs=id=>document.getElementById(id);
function setNet(m){qs('netStatus').textContent=m} function toast(m){const t=qs('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1500)} function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));qs(id).classList.add('active')}
function randCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function renderChars(){for(const side of ['p1','p2']){const h=qs(side+'cards');h.innerHTML='';names.forEach(n=>{const c=CHARS[n],b=document.createElement('button');b.type='button';b.className='char'+(state[side]===n?' selected':'');b.innerHTML='<span class="readyDot">선택</span><img src="'+CHARS[n].image+'" alt=""><div class="name">'+n+'</div><div class="stats">HP '+c.hp+' · 이동 '+c.speed+'<br>'+c.desc+'<br>기본: '+c.basic+'<br>궁극: '+c.ult+'</div>';b.addEventListener('click',()=>selectChar(side,n));h.appendChild(b)})}}
function selectChar(side,n){if(state.online&&state.host&&side==='p2'){toast('P2는 친구가 고르는 캐릭터예요');return}if(state.online&&!state.host&&side==='p1'){toast('P1은 방장이 고르는 캐릭터예요');return}state[side]=n;renderChars();qs(side+'Status').textContent='선택 완료: '+n;if(state.online)send({t:'select',who:side==='p1'?1:2,char:n})}
renderChars();
function destroyPeer(){if(state.peer){try{state.peer.destroy()}catch(e){}}state.peer=null;state.conn=null;state.online=false;state.remoteReady=false}
function createPeerAsHost(){if(typeof Peer!=='function'){setNet('온라인 모듈을 불러오지 못했어요. 인터넷이 연결된 상태에서 다시 열어주세요.');return}destroyPeer();const code=randCode();state.code=code;qs('roomCode').value=code;state.host=true;setNet('방 만드는 중… '+code);const peer=new Peer('yfa-'+code.toLowerCase());state.peer=peer;peer.on('open',()=>{state.online=true;setNet('방 생성 완료! 코드 '+code+' · 친구를 기다리는 중');updateStart()});peer.on('connection',conn=>{if(state.conn)try{state.conn.close()}catch(e){} state.conn=conn;conn.on('open',()=>{state.online=true;state.remoteReady=true;send({t:'hello',hostChar:state.p1,guestChar:state.p2});setNet('친구 연결 완료! P2 캐릭터 선택 가능 · 전투 시작 가능') ;updateStart()});conn.on('data',handleData);conn.on('close',()=>{state.remoteReady=false;setNet('친구와 연결이 끊겼어요.')})});peer.on('error',e=>{if(e.type==='unavailable-id'){setNet('이 방 코드가 이미 사용 중이에요. "방 만들기"를 다시 눌러주세요.')}else setNet('방 오류: '+e.type)})}
function createPeerAsGuest(code){if(typeof Peer!=='function'){setNet('온라인 모듈을 불러오지 못했어요. 인터넷이 연결된 상태에서 다시 열어주세요.');return}code=code.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code)){setNet('방 코드는 6자리 영문/숫자예요.');return}destroyPeer();state.code=code;state.host=false;setNet('방 참가 중…');const peer=new Peer();state.peer=peer;peer.on('open',()=>{const conn=peer.connect('yfa-'+code.toLowerCase(),{reliable:true});state.conn=conn;conn.on('open',()=>{state.online=true;state.remoteReady=true;setNet('방 입장 완료! P2 캐릭터를 고르세요.');send({t:'hello',hostChar:state.p1,guestChar:state.p2})});conn.on('data',handleData);conn.on('close',()=>{state.online=false;setNet('호스트와 연결이 끊겼어요.')})});peer.on('error',e=>setNet('방 참가 실패: '+e.type))}
function send(m){if(state.conn&&state.conn.open){try{state.conn.send(m)}catch(e){}}}
function handleData(m){if(!m||!m.t)return;if(m.t==='hello'){if(state.host){state.remoteReady=true;send({t:'select',who:1,char:state.p1});send({t:'select',who:2,char:state.p2})}else{state.p1=m.hostChar||state.p1;renderChars()}updateStart()}
else if(m.t==='select'){if(m.who===1)state.p1=m.char;if(m.who===2)state.p2=m.char;renderChars();updateStart()}
else if(m.t==='input'&&state.host&&world)world.p2.input=m.v;
else if(m.t==='attack'&&state.host&&world)resolveAttack(2,m.kind);
else if(m.t==='start'&&!state.host)startGame();
else if(m.t==='snap'&&!state.host)applySnapshot(m);
else if(m.t==='restart'){if(state.host){startGame();send({t:'restart'})}else{startGame()}}}
function updateStart(){qs('startBtn').disabled=!(state.host&&state.online&&state.remoteReady)}
qs('createBtn').addEventListener('click',e=>{e.preventDefault();createPeerAsHost()});
qs('joinBtn').addEventListener('click',e=>{e.preventDefault();createPeerAsGuest(qs('roomCode').value)});
qs('startBtn').addEventListener('click',()=>{if(!state.host||!state.online||!state.remoteReady)return;startGame();send({t:'start'})});
qs('testBtn').addEventListener('click',()=>{state.solo=true;state.host=true;state.online=false;startGame()});
qs('resetBtn').addEventListener('click',()=>location.reload());
qs('backBtn').addEventListener('click',()=>{state.running=false;clearTimeout(window._fightCountdown);window._fightCountdown=null;cancelAnimationFrame(raf);showScreen('lobby')});
qs('againBtn').addEventListener('click',()=>{if(state.solo){startGame()}else if(state.host){startGame();if(state.online)send({t:'restart'})}else send({t:'restart'})});
function resize(){const r=canvas.getBoundingClientRect();W=Math.max(320,Math.round(r.width*devicePixelRatio));H=Math.max(240,Math.round(r.height*devicePixelRatio));canvas.width=W;canvas.height=H}window.addEventListener('resize',resize);resize();const sx=()=>W/1000,sy=()=>H/620;
function makePlayer(side,char,x,y){const c=CHARS[char];return{side,char,x,y,r:32,hp:c.hp,maxHp:c.hp,dir:side===1?1:-1,input:{up:false,down:false,left:false,right:false},lastBasic:-99,lastUlt:-99,anim:'',animUntil:0,hitFlash:0,inv:0,celebrate:false}}
function startGame(){
clearInterval(window._fightCountdown);
window._fightCountdown=null;
state.running=true;showScreen('game');resize();fx=[];projectiles=[];
world={time:0,ended:false,winner:0,countdown:3000,p1:makePlayer(1,state.p1,220,310),p2:makePlayer(2,state.p2,780,310)};
qs('p1name').textContent='P1 '+state.p1;qs('p2name').textContent='P2 '+state.p2;
qs('roomBadge').textContent=state.online?'온라인 '+state.code:(state.solo?'혼자 테스트':'');
qs('gameOver').classList.remove('show');
startCountdown();
last=performance.now();cancelAnimationFrame(raf);loop(last)
}
function startCountdown(){
  clearTimeout(window._fightCountdown);
  window._fightCountdown=null;
  centerMsg('3',950);
  window._fightCountdown=setTimeout(()=>{
    centerMsg('2',950);
    window._fightCountdown=setTimeout(()=>{
      centerMsg('1',950);
      window._fightCountdown=setTimeout(()=>{
        centerMsg('FIGHT!',650);
        window._fightCountdown=null;
      },1000);
    },1000);
  },1000);
}
function centerMsg(t,ms){const e=qs('centerMsg');e.textContent=t;e.style.opacity='1';clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity='0',ms||700)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function move(p,dt){const c=CHARS[p.char],v=c.speed*dt/1000;let dx=(p.input.right?1:0)-(p.input.left?1:0),dy=(p.input.down?1:0)-(p.input.up?1:0);if(dx&&dy){dx*=.707;dy*=.707}p.x=clamp(p.x+dx*v,50,950);p.y=clamp(p.y+dy*v,80,570);if(dx)p.dir=dx>0?1:-1}
let audioCtx=null;
function initAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function playSfx(kind){try{initAudio();if(!audioCtx)return;const now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);const ult=kind==='ult',hit=kind==='hit';o.type=ult?'sawtooth':hit?'square':'triangle';o.frequency.setValueAtTime(ult?180:hit?95:330,now);o.frequency.exponentialRampToValueAtTime(ult?65:hit?55:170,now+(ult?.32:hit?.12:.09));g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(ult?.16:.09,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+(ult?.36:hit?.14:.1));o.start(now);o.stop(now+(ult?.38:hit?.16:.12))}catch(e){}}
function damage(t,amt,kx=0,ky=0){if(t.hp<=0||t.inv>0)return;t.hp=clamp(t.hp-amt,0,t.maxHp);t.hitFlash=120;t.inv=.08;t.x=clamp(t.x+kx,50,950);t.y=clamp(t.y+ky,80,570);playSfx('hit')}
function canUse(p,kind){const c=CHARS[p.char],now=world.time/1000;return kind==='basic'?now-p.lastBasic>=c.basicCd:now-p.lastUlt>=c.ultCd}function anim(p,a,ms){p.anim=a;p.animUntil=world.time+ms}
function resolveAttack(side,kind){
if(!world||world.ended||world.countdown>0)return;
const p=side===1?world.p1:world.p2,t=side===1?world.p2:world.p1,c=CHARS[p.char],now=world.time/1000,a=c.attacks?.[kind];
if(!a||!canUse(p,kind))return;
if(kind==='basic')p.lastBasic=now;else p.lastUlt=now;
if(a.type==='melee'){
 anim(p,a.effect==='snack'?'snackSwing':'bite',a.effect==='snack'?420:240);
 if(distance(p,t)<=a.range){damage(t,a.damage,a.knockbackX*p.dir,0);fx.push({type:'hit',x:t.x,y:t.y,life:260});if(a.effect==='snack')fx.push({type:'snack',x:p.x+p.dir*34,y:p.y,dir:p.dir,life:420});}
}else if(a.type==='dash'){
 anim(p,'dash',620);const d=distance(p,t),travel=Math.min(a.travel,Math.max(55,d-35)),sx0=p.x,sy0=p.y;p.x=clamp(p.x+travel*p.dir,50,950);if(distance(p,t)<a.range)damage(t,a.damage,a.knockbackX*p.dir,0);fx.push({type:'dash',x:p.x,y:p.y,fromX:sx0,fromY:sy0,dir:p.dir,life:620});
}else if(a.type==='homingProjectile'){
 anim(p,'talk',250);projectiles.push({owner:p.side,x:p.x+p.dir*40,y:p.y,vx:p.dir*a.speed,vy:0,life:a.life,dmg:a.damage,type:'word',text:a.text,homing:true,homingUntil:world.time+a.life});
}else if(a.type==='beam'){
 anim(p,'beam',520);const hit=(t.x-p.x)*p.dir>=0&&Math.abs(t.y-p.y)<a.yRange&&Math.abs(t.x-p.x)<a.range;if(hit)damage(t,a.damage,a.knockbackX*p.dir,0);fx.push({type:'beam',x:p.x,y:p.y,dir:p.dir,life:520,text:a.text});
}else if(a.type==='area'){
 anim(p,'party',800);fx.push({type:'party',x:p.x,y:p.y,life:900});if(distance(p,t)<=a.range)damage(t,a.damage,a.knockbackX*p.dir,0);
}
}
function stepProjectiles(dt){
for(let i=projectiles.length-1;i>=0;i--){
const q=projectiles[i],t=q.owner===1?world.p2:world.p1;
if(q.homing&&world.time<=q.homingUntil){
const dx=t.x-q.x,dy=t.y-q.y,dist=Math.hypot(dx,dy)||1;
const speed=Math.hypot(q.vx,q.vy)||720;
const targetVx=dx/dist*speed,targetVy=dy/dist*speed;
const turn=Math.min(1,dt/140);
q.vx+= (targetVx-q.vx)*turn;
q.vy+= (targetVy-q.vy)*turn;
}
q.x+=q.vx*dt/1000;q.y+=q.vy*dt/1000;q.life-=dt;
if(q.life<=0||q.x<0||q.x>1000||q.y<0||q.y>620){projectiles.splice(i,1);continue}
if(Math.hypot(q.x-t.x,q.y-t.y)<40){
damage(t,q.dmg,26*(q.vx>0?1:-1),0);
fx.push({type:'hit',x:t.x,y:t.y,life:220});
projectiles.splice(i,1)
}
}}
function stepFX(dt){for(let i=fx.length-1;i>=0;i--){fx[i].life-=dt;if(fx[i].life<=0)fx.splice(i,1)}}
function ai(){const a=world.p2,b=world.p1,d=distance(a,b),dx=b.x-a.x,dy=b.y-a.y;const danger=projectiles.some(q=>q.owner===1&&Math.abs(q.y-a.y)<60&&Math.abs(q.x-a.x)<220);const strafe=Math.sin(world.time/260)>0;a.input={up:danger?dy<0:(Math.abs(dy)>45&&dy<0),down:danger?dy>=0:(Math.abs(dy)>45&&dy>0),left:danger?(strafe?dx<0:true):d>150&&dx<0,right:danger?(strafe?dx>=0:false):d>150&&dx>0};if(d<150){a.input.left=dx<0;a.input.right=dx>0}if(canUse(a,'basic')&&Math.random()<.075)resolveAttack(2,'basic');if(canUse(a,'ult')&&Math.random()<.018)resolveAttack(2,'ult')}
function tick(dt){
if(!world||world.ended)return;
if(world.countdown>0){
world.countdown=Math.max(0,world.countdown-dt);
return;
}
world.time+=dt;world.p1.hitFlash=Math.max(0,world.p1.hitFlash-dt);world.p2.hitFlash=Math.max(0,world.p2.hitFlash-dt);world.p1.inv=Math.max(0,world.p1.inv-dt/1000);world.p2.inv=Math.max(0,world.p2.inv-dt/1000);if(state.host){world.p1.input={...keys};move(world.p1,dt);if(state.solo)ai();else move(world.p2,dt);stepProjectiles(dt);stepFX(dt);if(world.p1.hp<=0||world.p2.hp<=0){world.ended=true;world.winner=world.p1.hp>0?1:2;endGame(world.winner)}if(state.online){netClock+=dt;if(netClock>=50){netClock=0;send(snapshot())}}}else{world.p2.input={...keys};send({t:'input',v:{...keys}});stepFX(dt)}}
function snapshot(){return{t:'snap',time:world.time,p1:{...world.p1,input:{...world.p1.input}},p2:{...world.p2,input:{...world.p2.input}},fx:fx.map(f=>({...f})),projectiles:projectiles.map(p=>({...p})),ended:world.ended,winner:world.winner}}
function applySnapshot(m){if(!world)startGame();Object.assign(world.p1,m.p1||{});Object.assign(world.p2,m.p2||{});world.time=m.time||world.time;fx=m.fx||[];projectiles=m.projectiles||[];if(m.ended)endGame(m.winner)}
function endGame(w){
if(!world)return;
world.ended=true;
world.winner=w;
world.p1.celebrate=w===1;
world.p2.celebrate=w===2;
fx.push({type:'victory',x:w===1?world.p1.x:world.p2.x,y:w===1?world.p1.y:world.p2.y,life:3200});
qs('winnerText').textContent=(w===1?'P1 승리!':'P2 승리!');
qs('overSub').textContent=w===1?state.p1+' 승리':state.p2+' 승리';
qs('gameOver').classList.add('show');
centerMsg('KO!',1100)
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawBG(){ctx.save();ctx.scale(sx(),sy());ctx.fillStyle='#14283b';ctx.fillRect(0,0,1000,620);ctx.fillStyle='#1a3a4e';ctx.fillRect(35,55,930,520);ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;for(let x=55;x<960;x+=50){ctx.beginPath();ctx.moveTo(x,55);ctx.lineTo(x,575);ctx.stroke()}for(let y=75;y<575;y+=50){ctx.beginPath();ctx.moveTo(35,y);ctx.lineTo(965,y);ctx.stroke()}ctx.strokeStyle='rgba(167,139,250,.45)';ctx.lineWidth=5;ctx.strokeRect(35,55,930,520);ctx.strokeStyle='rgba(255,255,255,.12)';ctx.setLineDash([8,10]);ctx.beginPath();ctx.moveTo(500,55);ctx.lineTo(500,575);ctx.stroke();ctx.setLineDash([]);ctx.restore()}
const imgCache={};
for(const n of names){
  const im=new Image();
  im.decoding='async';
  im.onload=()=>{im._failed=false;draw()};
  im.onerror=()=>{im._failed=true;draw()};
  im.src=CHARS[n].image;
  imgCache[n]=im;
}
function drawPlayer(p){
const c=CHARS[p.char],img=imgCache[p.char],x=p.x*sx(),y=p.y*sy(),r=42*Math.min(sx(),sy());
ctx.save();
let celebrateScale=1,celebrateY=0,celebrateRot=0;
if(p.celebrate){const tt=performance.now()/1000;celebrateScale=1+Math.abs(Math.sin(tt*7))*.08;celebrateY=-Math.abs(Math.sin(tt*7))*28;celebrateRot=Math.sin(tt*7)*.16;}
ctx.translate(x,y+celebrateY);ctx.rotate(celebrateRot);ctx.scale(celebrateScale,celebrateScale);if(p.dir<0)ctx.scale(-1,1);ctx.globalAlpha=p.hitFlash>0?.58:1;
ctx.fillStyle=c.color;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
if(img && img.complete && img.naturalWidth>0 && !img._failed){
  ctx.save();ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.clip();ctx.drawImage(img,-r,-r,r*2,r*2);ctx.restore();
}
ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.arc(0,0,r*.72,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#fff';ctx.font='900 '+Math.max(16,r*.58)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(c.shortName||c.name.slice(0,1),0,0);
ctx.restore();

ctx.save();ctx.translate(x,y);if(p.dir<0)ctx.scale(-1,1);
const remain=Math.max(0,p.animUntil-world.time);
if(p.anim==='talk'&&remain>0){ctx.fillStyle='#fff';roundRect(20,-78,105,40,13);ctx.fill();ctx.fillStyle='#ff2f88';ctx.font='1000 13px system-ui';ctx.textAlign='left';ctx.fillText('야매떼',37,-53)}
if(p.anim==='dash'&&remain>0){ctx.globalAlpha=.7;ctx.fillStyle=c.color;ctx.beginPath();ctx.moveTo(15,0);ctx.lineTo(-95,-28);ctx.lineTo(-95,28);ctx.closePath();ctx.fill()}
if(p.anim==='snackSwing'&&remain>0){const progress=1-remain/420;let swing;if(progress<.38){const t=progress/.38;swing=-1.55+t*.20}else{const t=(progress-.38)/.62;swing=-1.35+t*2.90}const lift=progress<.38?-12*Math.sin((progress/.38)*Math.PI/2):0;ctx.save();ctx.translate(18,lift);ctx.rotate(swing);ctx.strokeStyle='#f4c9a8';ctx.lineWidth=14;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(48,0);ctx.stroke();ctx.fillStyle='#f3c969';roundRect(38,-9,112,18,8);ctx.fill();ctx.fillStyle='#9b642d';for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(58+i*18,0,3,0,Math.PI*2);ctx.fill()}ctx.restore()}
ctx.restore();

ctx.save();ctx.scale(sx(),sy());ctx.fillStyle='rgba(0,0,0,.55)';ctx.font='900 12px system-ui';ctx.textAlign='center';ctx.fillText((p.side===1?'P1 ':'P2 ')+c.name,p.x,p.y-50);ctx.restore();
}

function drawProjectiles(){projectiles.forEach(q=>{ctx.save();ctx.translate(q.x*sx(),q.y*sy());if(q.type==='word'){ctx.fillStyle='#fff';roundRect(-40,-18,86,36,12);ctx.fill();ctx.fillStyle='#ff2f88';ctx.font='1000 13px system-ui';ctx.textAlign='center';ctx.fillText(q.text,3,5)}ctx.restore()})}
function drawFX(){fx.forEach(f=>{const a=Math.min(1,Math.max(0,f.life/900));ctx.save();ctx.globalAlpha=a;if(f.type==='snack'){ctx.save();ctx.translate(f.x*sx(),f.y*sy());ctx.rotate((1-f.life/420)*f.dir*1.5);ctx.font='34px serif';ctx.fillText('🍪',25,0);ctx.restore()}if(f.type==='hit'||f.type==='bite'||f.type==='snack'||f.type==='dash'){ctx.strokeStyle=f.type==='hit'?'#fff':'#ffd966';ctx.lineWidth=8;ctx.beginPath();ctx.arc(f.x*sx(),f.y*sy(),30+(1-a)*48,0,Math.PI*2);ctx.stroke()}else if(f.type==='beam'){ctx.fillStyle='#fff';ctx.font='900 22px system-ui';ctx.textAlign='center';ctx.fillText(f.text||'빔!!!',(f.x+f.dir*250)*sx(),(f.y-55)*sy());ctx.strokeStyle='#ff55b3';ctx.lineWidth=28;ctx.beginPath();ctx.moveTo(f.x*sx(),f.y*sy());ctx.lineTo((f.x+f.dir*620)*sx(),f.y*sy());ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=7;ctx.stroke()}else if(f.type==='victory'){
const colors=['#ffd166','#ff5c8a','#6ee7ff','#b794f4','#7ee787'];
for(let i=0;i<18;i++){
const ang=i*0.9+performance.now()/500,rad=(1-a)*190+35;
ctx.fillStyle=colors[i%colors.length];
ctx.font='22px serif';
ctx.fillText(i%2?'✨':'🎉',(f.x+Math.cos(ang)*rad)*sx(),(f.y-90+Math.sin(ang)*rad)*sy());
}
ctx.fillStyle='#ffe066';ctx.font='1000 30px system-ui';ctx.textAlign='center';
ctx.fillText('WIN!',f.x*sx(),(f.y-105-Math.abs(Math.sin(performance.now()/180))*18)*sy());
}else if(f.type==='party'){const r=180+(1-a)*35;ctx.strokeStyle='#ff9ad1';ctx.lineWidth=5;ctx.beginPath();ctx.arc(f.x*sx(),f.y*sy(),r*Math.min(sx(),sy()),0,Math.PI*2);ctx.stroke();const snacks=['🍪','🍫','🍬','🍭','🍿','🥨','🍩'];for(let i=0;i<snacks.length;i++){const ang=world.time/450+i;ctx.font='26px serif';ctx.fillText(snacks[i],(f.x+Math.cos(ang)*(r-26))*sx(),(f.y+Math.sin(ang)*(r-26))*sy())}}ctx.restore()})}
function cdHtml(p,now){const c=CHARS[p.char],b=Math.max(0,c.basicCd-(now-p.lastBasic)),u=Math.max(0,c.ultCd-(now-p.lastUlt));return '<span class="cd">기본 '+(b<.01?'OK':b.toFixed(1)+'s')+'</span><span class="cd">궁극 '+(u<.01?'OK':u.toFixed(1)+'s')+'</span>'}
function hud(){const now=world.time/1000;qs('p1hptext').textContent=Math.ceil(world.p1.hp)+' / '+world.p1.maxHp;qs('p2hptext').textContent=Math.ceil(world.p2.hp)+' / '+world.p2.maxHp;qs('p1fill').style.width=(100*world.p1.hp/world.p1.maxHp)+'%';qs('p2fill').style.width=(100*world.p2.hp/world.p2.maxHp)+'%';qs('p1cd').innerHTML=cdHtml(world.p1,now);qs('p2cd').innerHTML=cdHtml(world.p2,now);if(!state.host){qs('basicBtn').textContent=CHARS[state.p2].basic;qs('ultBtn').textContent=CHARS[state.p2].ult}else{qs('basicBtn').textContent=CHARS[state.p1].basic;qs('ultBtn').textContent=CHARS[state.p1].ult}}
function draw(){ctx.clearRect(0,0,W,H);drawBG();if(world){drawFX();drawProjectiles();drawPlayer(world.p1);drawPlayer(world.p2);hud()}}
function loop(t){raf=requestAnimationFrame(loop);const dt=Math.min(50,t-last);last=t;tick(dt);draw()}
function trigger(kind){if(!world||world.ended||!state.running)return;const me=state.host?world.p1:world.p2;if(!canUse(me,kind))return;const b=qs(kind==='basic'?'basicBtn':'ultBtn');b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash');initAudio();playSfx(kind==='ult'?'ult':'basic');if(state.host)resolveAttack(1,kind);else send({t:'attack',kind})}
function bindAttackButton(id,kind){
  const b=qs(id);let pressed=false;
  const fire=e=>{if(e){e.preventDefault();e.stopPropagation();}if(pressed)return;pressed=true;trigger(kind);setTimeout(()=>pressed=false,160);};
  b.addEventListener('pointerdown',fire,{passive:false});
  b.addEventListener('pointerup',()=>pressed=false,{passive:false});
  b.addEventListener('pointercancel',()=>pressed=false,{passive:false});
  b.addEventListener('click',e=>{if(e.detail===0)fire(e);});
}
bindAttackButton('basicBtn','basic');
bindAttackButton('ultBtn','ult');
const keyMap={w:'up',a:'left',s:'down',d:'right',ArrowUp:'up',ArrowLeft:'left',ArrowDown:'down',ArrowRight:'right'};window.addEventListener('keydown',e=>{const k=keyMap[e.key.toLowerCase?.()||e.key];if(k){keys[k]=true;e.preventDefault();return}const low=e.key.toLowerCase();if(low==='f'){e.preventDefault();trigger('ult')}});window.addEventListener('keyup',e=>{const k=keyMap[e.key.toLowerCase?.()||e.key];if(k){keys[k]=false;e.preventDefault()}});window.addEventListener('mousedown',e=>{if(e.button!==0||!state.running||!world||world.ended)return;if(e.target.closest('button,input'))return;e.preventDefault();trigger('basic')});
for(const b of document.querySelectorAll('.dpad button')){
  const k=b.dataset.key;
  const on=e=>{e.preventDefault();e.stopPropagation();if(e.pointerId!=null)b.setPointerCapture?.(e.pointerId);keys[k]=true};
  const off=e=>{if(e){e.preventDefault();}keys[k]=false};
  b.addEventListener('pointerdown',on,{passive:false});
  b.addEventListener('pointerup',off,{passive:false});
  b.addEventListener('pointercancel',off,{passive:false});
  b.addEventListener('pointerleave',off,{passive:false});
  b.addEventListener('touchstart',on,{passive:false});
  b.addEventListener('touchend',off,{passive:false});
  b.addEventListener('touchcancel',off,{passive:false});
}window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
setInterval(()=>{if(world&&!state.host)world.p2.input={...keys}},20);
